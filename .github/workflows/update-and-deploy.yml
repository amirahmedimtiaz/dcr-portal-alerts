name: Update and deploy Solar DCR dashboard

on:
  workflow_dispatch:
  schedule:
    # 00:00 UTC Saturday = 09:00 JST Saturday.
    - cron: "0 0 * * 6"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: solar-dcr-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DATABASE_PATH: data/portal.db
      DASHBOARD_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
      EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
      EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
      EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}
      SEND_NO_CHANGE_EMAIL: "1"
      HISTORY_START_YEAR: "2022"
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Scrape portal and send Gmail digest
        run: python run.py

      - name: Build static dashboard
        run: python site_builder.py

      - name: Persist scraper database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/portal.db
          if git diff --cached --quiet; then
            echo "No database changes to commit."
          else
            git commit -m "Update Solar DCR data"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

